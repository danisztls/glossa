<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- The one font file every page is certain to need: EB Garamond's latin
		     subset, upright. Declared here rather than left to the @font-face in
		     app.css so the fetch starts alongside the stylesheet instead of
		     after the browser has parsed it and matched a unicode-range.

		     Deliberately the ONLY font preloaded. Italic, latin-ext, greek and
		     vietnamese are each needed by a minority of pages, and preloading a
		     file the page never uses costs bandwidth and delays the one it does.
		     `crossorigin` is required even though this is same-origin: fonts are
		     fetched in CORS mode, and without it the preload is discarded and
		     the file downloaded a second time. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/eb-garamond-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<!-- Matches src/app.css's --color-bg-elevated (the header's background)
		     in each theme; the manifest itself only carries one theme_color
		     (its light value — see static/manifest.webmanifest), so the dark
		     variant lives here where prefers-color-scheme can pick it. -->
		<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#201e24" media="(prefers-color-scheme: dark)" />
		<script>
			// Apply the stored theme and reading font scale before first paint,
			// to avoid a flash of the wrong theme/size. Kept in sync with
			// src/lib/theme.svelte.ts and src/lib/prefs.svelte.ts.
			try {
				// 'auto' (the default) means "no data-theme attribute" — CSS
				// prefers-color-scheme decides — which is already the markup's
				// resting state, so there's nothing to apply for it.
				var t = localStorage.getItem('glossa:theme');
				if (t === 'light' || t === 'dark' || t === 'sepia') {
					document.documentElement.setAttribute('data-theme', t);
				}
			} catch (e) {}
			try {
				var s = Number(localStorage.getItem('glossa:font-scale'));
				if (s >= 0.8 && s <= 1.8) {
					document.documentElement.style.setProperty('--reading-scale', String(s));
				}
			} catch (e) {}
			// The static shell is authored in English, but a reader with no saved
			// choice should still get the document language matching their browser
			// as early as possible. The app store performs the same negotiation and
			// persists the result during hydration; this only keeps the outer
			// document semantically correct before then.
			try {
				var l = localStorage.getItem('glossa:ui-lang');
				if (l !== 'en' && l !== 'pt') {
					var ls =
						navigator.languages && navigator.languages.length
							? navigator.languages
							: [navigator.language];
					l = 'en';
					for (var i = 0; i < ls.length; i++) {
						var p = String(ls[i]).trim().toLowerCase().split('-', 1)[0];
						if (p === 'en' || p === 'pt') {
							l = p;
							break;
						}
					}
				}
				document.documentElement.lang = l;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
