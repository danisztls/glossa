<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply any stored theme before first paint, to avoid a flash of
			// the wrong theme. Kept in sync with src/lib/theme.svelte.ts.
			try {
				var t = localStorage.getItem('depositum:theme');
				if (t === 'light' || t === 'dark' || t === 'sepia') {
					document.documentElement.setAttribute('data-theme', t);
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
