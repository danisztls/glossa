<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The shell had NO `<title>` at all until now, which is a stronger
		     statement than it looks: the head placeholder at the foot of this
		     `<head>` interpolates to nothing in an SPA build, so every consumer
		     that does not run JavaScript received an untitled document — 5,812
		     of them, identical, one per canonical address. A search result, a
		     link unfurl or a chat preview then falls back to showing the URL.

		     Note the placeholder is NAMED rather than spelled here: SvelteKit
		     substitutes it with a plain `String.replace(string, …)`, which
		     rewrites the FIRST occurrence in the file and no other (see
		     @sveltejs/kit's core/sync/write_server.js). Writing it literally in
		     this comment fed the head into the comment and left the real one at
		     the foot of the `<head>` as text — which the parser then moved into
		     the body, so the shell printed the token at the top of the page and
		     the boot script never ran. src/lib/shell-meta.test.ts now counts
		     the occurrences.

		     Safe to state statically because Svelte compiles a `<title>` inside
		     `<svelte:head>` to an assignment to `document.title` rather than to
		     an appended element (see the compiler's TitleElement visitor). So
		     this is the initial value and the route's own title overwrites it at
		     hydration; it does not become a second `<title>` that shadows the
		     real one. That is also why the root layout and a page can both
		     declare one today.

		     It is the site name and nothing else, deliberately: this document is
		     served for every address, so the only honest title is the one true
		     of all of them. Per-address titles for a consumer that does not
		     render would have to come from the edge — see docs/decisions.md
		     §The site, "What a crawler that does not render is told".

		     Equal to `home.title` in src/lib/i18n/en.ts, which the root layout
		     sets at hydration; src/lib/shell-meta.test.ts fails when they
		     drift. -->
		<title>Glossa Catholica</title>
		<!-- The site is one SPA shell (`+layout.ts` sets `ssr = false`, and the
		     build emits no per-route HTML), so every address is served this same
		     document and a `<svelte:head>` description would not exist until
		     hydration. This static one is therefore the only description a
		     consumer that does not run JavaScript will ever see — every social
		     unfurler, and every crawler that is not Google — which is why it
		     describes the library rather than any one page.

		     It is the same sentence as `description` in
		     static/manifest.webmanifest, which the install prompt shows. Two
		     copies by necessity: the manifest is JSON a browser reads on its own
		     terms and cannot be interpolated from here. src/lib/shell-meta.test.ts
		     fails when they drift. -->
		<meta
			name="description"
			content="Scripture and the Magisterium — the Bible, the Catechism, the Compendium, and the documents of the Church. Free to read, offline-first."
		/>
		<!-- Open Graph, which is what a link to this site actually looks like
		     nearly everywhere it is pasted: a chat client, a forum, a social
		     post. Everything above is read by a search engine; this block is
		     read by the unfurler sitting between a reader and their first visit,
		     and it was absent, so that unfurl was the URL and nothing else.

		     Like the `<title>` and the description above, these are STATIC and
		     library-wide, because `ssr = false` means one document answers all
		     5,812 canonical addresses. A per-address card would have to come
		     from the edge — docs/decisions.md, "What a crawler that does not
		     render is told" — and nothing here can stand in for it.

		     `og:url` IS DELIBERATELY ABSENT, and it is the one tag whose absence
		     is load-bearing. Its job is to declare the canonical address of the
		     thing being unfurled, and the only value this file could carry is
		     the site root: every unfurl of /catechismus/330 would then title and
		     link the home page instead. Omitted, an unfurler falls back to the
		     URL it fetched, which is the correct one by construction.

		     `og:image` must be absolute — a relative path is unresolvable to a
		     scraper that is not a browser — so the host is written out rather
		     than interpolated. `%sveltekit.assets%` is empty in this build and
		     would yield a rooted path, not a URL. The host is the one
		     `wrangler.jsonc` routes.

		     `og:locale` is likewise absent rather than `en_US`: the interface
		     language is a stored preference, not part of the address, so no one
		     value is true of the document. Consumers default to en_US, which is
		     what this shell is authored in.

		     Twitter reads the `og:*` tags for everything except the card SHAPE,
		     which has no Open Graph equivalent — hence one `twitter:` tag and
		     not a duplicate set. `summary_large_image` is the full-bleed card;
		     the default `summary` would crop this one to a square thumbnail and
		     lose both lines of the wordmark.

		     The image itself is generated by `scripts/og-image.mjs` from the
		     manifest's name and description, in the site's own faces and
		     palette; src/lib/shell-meta.test.ts fails when the tags below, the
		     title, the description or the PNG's own dimensions drift apart. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Glossa Catholica" />
		<meta property="og:title" content="Glossa Catholica" />
		<meta
			property="og:description"
			content="Scripture and the Magisterium — the Bible, the Catechism, the Compendium, and the documents of the Church. Free to read, offline-first."
		/>
		<meta property="og:image" content="https://glossacatholica.org/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="The wordmark Glossa Catholica, set in blackletter within a double rule, above the line “Scripture and the Magisterium”."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link
			rel="icon"
			href="%sveltekit.assets%/icons/icon-192.png"
			type="image/png"
			sizes="192x192"
		/>
		<!-- The three font files every page is certain to need, upright latin in
		     each: EB Garamond for the text, Source Sans 3 for the chrome, and
		     the Pirata One subset for the wordmark. Declared here rather than
		     left to the @font-face in app.css so the fetches start alongside
		     the stylesheet instead of after the browser has parsed it and
		     matched a unicode-range.

		     THE THIRD ONE IS NOT DECORATION-ONLY, which is why it earns a
		     preload the other display faces don't. `components/Wordmark.svelte`
		     sets the header mark in it on every route, and its @font-face is
		     `font-display: block` (see app.css — a late swap on one large glyph
		     in an accent colour lurches), so the mark is INVISIBLE until the
		     file lands. Without this line it is discovered three levels deep:
		     document -> app.css -> font, and, because this is an SPA shell with
		     an empty body, not even then — the request only starts once the
		     boot JS has mounted a header for the font to match against.
		     Lighthouse measured that chain at 683 ms for 6 KB. Preloaded, it
		     starts with the stylesheet and is done long before the mount.

		     Deliberately only these three. Italic, latin-ext, greek, cyrillic
		     and vietnamese are each needed by a minority of pages, and
		     preloading a file the page never uses costs bandwidth and delays
		     the one it does; Ponomar is the Russian edition's initial and no
		     other page touches it. The sans qualifies under the same rule the
		     serif does — `body` carries it, so every page renders some of it
		     above the fold — and it is the smaller of the two. `crossorigin` is
		     required even though this is same-origin: fonts are fetched in CORS
		     mode, and without it the preload is discarded and the file
		     downloaded a second time. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/eb-garamond-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/source-sans-3-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/pirata-one-dropcap.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<!-- Matches src/app.css's --color-bg-elevated (the header's background)
		     in each theme; the manifest itself only carries one theme_color
		     (its light value — see static/manifest.webmanifest), so the dark
		     variant lives here where prefers-color-scheme can pick it. -->
		<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1f1b1b" media="(prefers-color-scheme: dark)" />
		<script>
			// Apply the stored appearance settings and reading font scale before
			// first paint, to avoid a flash of the wrong theme/size. Kept in sync
			// with src/lib/theme.svelte.ts and src/lib/prefs.svelte.ts.
			try {
				// Dark mode 'auto' (the default) means "no data-theme attribute" —
				// CSS prefers-color-scheme decides — which is already the markup's
				// resting state, so there's nothing to apply for it. Sepia is a
				// separate presence-only attribute; the stylesheet, not this
				// script, is what makes it yield to dark. `data-oled` is the
				// same shape, yielding to light instead. `data-mono` yields to
				// neither and suspends sepia; the stylesheet does that too.
				var m = localStorage.getItem('glossa:dark-mode');
				var sep = localStorage.getItem('glossa:sepia');
				var oled = localStorage.getItem('glossa:oled');
				var mono = localStorage.getItem('glossa:mono');
				if (m === null && sep === null && oled === null && mono === null) {
					// Same migration off the old single-valued key as
					// theme.svelte.ts's migrateLegacy — without it, a returning
					// reader flashes the default theme on every load until they
					// next touch the setting.
					var legacy = localStorage.getItem('glossa:theme');
					if (legacy === 'light') m = 'off';
					else if (legacy === 'dark') m = 'on';
					else if (legacy === 'sepia') {
						m = 'off';
						sep = '1';
					}
				}
				if (m === 'on' || m === 'off') {
					document.documentElement.setAttribute('data-theme', m === 'on' ? 'dark' : 'light');
				}
				if (sep === '1') {
					document.documentElement.setAttribute('data-sepia', '');
				}
				if (oled === '1') {
					document.documentElement.setAttribute('data-oled', '');
				}
				if (mono === '1') {
					document.documentElement.setAttribute('data-mono', '');
				}
			} catch (e) {}
			try {
				var s = Number(localStorage.getItem('glossa:font-scale'));
				if (s >= 0.8 && s <= 1.8) {
					document.documentElement.style.setProperty('--reading-scale', String(s));
				}
			} catch (e) {}
			// The static shell is authored in English, but a reader with no saved
			// choice should still get the document language matching their browser
			// as early as possible. The app store performs the same negotiation and
			// persists the result during hydration; this only keeps the outer
			// document semantically correct before then.
			//
			// `dir` matters more than `lang` does here, and is why this block is
			// worth keeping in sync by hand: an Arabic reader whose direction is
			// only set at hydration watches the whole page flip sides. Keep the
			// list below equal to UI_LANGS and RTL_LANGS in src/lib/i18n.svelte.ts.
			try {
				var UI = [
					'en',
					'pt',
					'la',
					'de',
					'es',
					'fr',
					'it',
					'hu',
					'pl',
					'ro',
					'sl',
					'sv',
					'ru',
					'ar'
				];
				var l = localStorage.getItem('glossa:ui-lang');
				if (UI.indexOf(l) === -1) {
					var ls =
						navigator.languages && navigator.languages.length
							? navigator.languages
							: [navigator.language];
					l = 'en';
					for (var i = 0; i < ls.length; i++) {
						var p = String(ls[i]).trim().toLowerCase().split('-', 1)[0];
						if (UI.indexOf(p) !== -1) {
							l = p;
							break;
						}
					}
				}
				document.documentElement.lang = l;
				document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
