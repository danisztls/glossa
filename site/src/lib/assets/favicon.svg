<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ichthys">
	<title>Depositum</title>
	<!--
		The ichthys (ΙΧΘΥΣ), drawn as the two crossing arcs it has always been:
		one stroke from each tail tip, over and under the body, meeting at the
		nose. Two paths rather than one outlined shape so the mark stays a
		drawn line at every size — an outlined-and-filled version collapses
		into a blob at 16px, which is the size that actually matters for a
		favicon.

		No Greek letters. At tab size they are illegible, and an ichthys that
		has to be squinted at is worse than one that reads instantly.

		Colour follows the site's accent, and follows the THEME: `#7a1f2b`
		(app.css's light `--color-accent`) disappears against a dark browser
		chrome, so `prefers-color-scheme: dark` swaps in the same palette's
		`#d98a92`. SVG favicons honour this media query in browsers that
		support them; ones that don't fall back to the PNG icons in
		`static/icons/`, which are drawn on their own background and so need
		no such adaptation.

		Kept stroked (not converted to paths) deliberately: `stroke-width` is
		the one knob that tunes legibility at small sizes, and flattening the
		geometry would take it away.
	-->
	<style>
		.ichthys {
			stroke: #7a1f2b;
		}
		@media (prefers-color-scheme: dark) {
			.ichthys {
				stroke: #d98a92;
			}
		}
	</style>
	<g class="ichthys" fill="none" stroke-width="5" stroke-linecap="round">
		<path d="M5 48 C 16 40, 30 2, 58 32" />
		<path d="M5 16 C 16 24, 30 62, 58 32" />
	</g>
</svg>
