<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Glossa Catholica">
	<title>Glossa Catholica</title>
	<!--
		The wordmark's two initials in Pirata One, the blackletter the site already
		sets its drop caps and its wordmark in.

		OUTLINED, NOT TEXT, and that is forced rather than chosen: browsers do not
		load a webfont referenced from inside an SVG favicon, so a text element here
		would silently fall back to whatever the platform picks and stop being the
		wordmark at all. These paths came out of static/fonts/pirata-one-dropcap.woff2
		via fontTools. That file is the source of truth; this one is regenerated, never
		hand-edited.

		The pair is TRACKED IN by 57 units off the natural advance (364 instead of 421).
		That number was chosen by rasterizing, not by eye: at the natural advance the
		two letters read as two separate marks floating in the frame, and at 330 the
		gap between them closes up at 16px. 364 is the value that still reads as one
		mark while keeping daylight between the letters at tab size.

		Known limit, recorded so nobody rediscovers it: Pirata One's G is a C with a
		short leg, so the two letters are separated by about two pixels of detail at
		16px. The mark is RECOGNISABLE there, not readable — which is the correct job
		for a favicon, but it is why the two colours below are load-bearing rather
		than decorative. In one colour this mark would be a blur of two near-identical
		shapes.

		THE COLOUR NOTE LIVES IN THE style BLOCK BELOW, NOT HERE, for the reason the
		ichthys this replaced had recorded: an XML comment may not contain a double
		hyphen, so a custom property cannot be written by its real name inside one,
		and rsvg-convert (which rasterizes static/icons/) refuses such a file outright
		rather than tolerating it the way a browser would.
	-->
	<style>
		/*
		 * Exactly the wordmark's two colours, so the tab and the page agree: the
		 * initial G takes the drop-cap vermilion (app.css's --color-initial, NOT
		 * --color-accent, which is the link red), and the C takes body text.
		 * Both follow the theme, because #1c1a17 disappears against dark browser
		 * chrome. Browsers without SVG favicon support fall back to the PNGs in
		 * static/icons/, which are drawn on their own background and so need no
		 * such adaptation.
		 */
		.initial {
			fill: #b03024;
		}
		.rest {
			fill: #1c1a17;
		}
		@media (prefers-color-scheme: dark) {
			.initial {
				fill: #f2694a;
			}
			.rest {
				fill: #e9e6de;
			}
		}
	</style>
	<g transform="translate(1.569 61.000) scale(0.07532 -0.07532)">
		<path class="initial" d="M221 92Q240 92 260 108V237Q260 298 219 306V328L320 385Q341 376 361.0 355.5Q381 335 381 317V93Q381 85 271.5 42.5Q162 0 137.5 0.0Q113 0 81.5 43.0Q50 86 50 146V678Q50 685 164.5 727.5Q279 770 296 770Q302 770 310.0 741.0Q318 712 328.5 671.0Q339 630 350.5 610.5Q362 591 394 591V571Q372 561 319.5 535.5Q267 510 263 510Q248 510 225.0 591.5Q202 673 188 673Q178 673 170 663V166Q170 92 221 92Z" />
		<path class="rest" transform="translate(364 0)" d="M188 673Q178 673 170 663V250Q170 208 175.0 182.5Q180 157 197 132Q230 84 348 84V55Q343 55 274.0 27.5Q205 0 190 0Q140 0 95.0 57.5Q50 115 50 179V678Q50 685 164.5 727.5Q279 770 296 770Q302 770 310.0 741.0Q318 712 328.5 671.0Q339 630 350.5 610.5Q362 591 394 591V571Q372 561 319.5 535.5Q267 510 263 510Q248 510 225.0 591.5Q202 673 188 673Z" />
	</g>
</svg>
